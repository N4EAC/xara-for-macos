name: macOS release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: rustup toolchain install stable --profile minimal
      - run: ./scripts/build_macos_ui.sh
        env:
          RUSTUP_TOOLCHAIN: stable
      - name: Package
        working-directory: target/macos
        run: |
          ditto -c -k --sequesterRsrc --keepParent XARA.app XARA-macOS-arm64.zip
          shasum -a 256 XARA-macOS-arm64.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: XARA-macOS-arm64
          path: |
            target/macos/XARA-macOS-arm64.zip
            target/macos/SHA256SUMS
          if-no-files-found: error
